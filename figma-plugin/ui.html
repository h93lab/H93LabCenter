<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font:
          13px/1.7 Inter,
          Arial,
          sans-serif;
        margin: 24px;
        background: var(--figma-color-bg, #fff);
        color: var(--figma-color-text, #222);
      }
      h1 {
        font-size: 21px;
      }
      p {
        color: var(--figma-color-text-secondary, #666);
      }
      textarea {
        width: 100%;
        height: 180px;
        box-sizing: border-box;
        border: 1px solid #aaa;
        border-radius: 6px;
        padding: 10px;
        margin: 14px 0;
        background: transparent;
        color: inherit;
      }
      button {
        padding: 12px 16px;
        background: #222;
        color: white;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      #status {
        white-space: pre-wrap;
      }
      input {
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <h1>Blueprint → Figma</h1>
    <p>
      Import a version from H93Lab. Each version gets its own editable page,
      preserving your design work.
    </p>
    <input type="file" id="file" accept="application/json,.json" /><textarea
      id="payload"
      placeholder="Or paste figma-handoff.json here"
      aria-label="Handoff JSON"
    ></textarea
    ><button id="import">Create editable screens</button
    ><button id="receipt" hidden>Download receipt</button>
    <p id="status" role="status"></p>
    <script>
      const input = document.querySelector("#payload"),
        status = document.querySelector("#status"),
        button = document.querySelector("#import");
      let receipt;
      document.querySelector("#file").onchange = async (e) => {
        input.value = await e.target.files[0].text();
      };
      button.onclick = () => {
        try {
          const payload = JSON.parse(input.value);
          button.disabled = true;
          status.textContent = "Importing…";
          parent.postMessage(
            { pluginMessage: { type: "import", payload } },
            "*",
          );
        } catch {
          status.textContent = "Select a valid JSON file.";
        }
      };
      onmessage = (e) => {
        const m = e.data.pluginMessage;
        if (!m) return;
        button.disabled = false;
        status.textContent = m.text;
        if (m.receipt) {
          receipt = m.receipt;
          document.querySelector("#receipt").hidden = false;
        }
      };
      document.querySelector("#receipt").onclick = () => {
        const u = URL.createObjectURL(
          new Blob([JSON.stringify(receipt, null, 2)], {
            type: "application/json",
          }),
        );
        const a = document.createElement("a");
        a.href = u;
        a.download = "figma-receipt.json";
        a.click();
        setTimeout(() => URL.revokeObjectURL(u), 1000);
      };
    </script>
  </body>
</html>
